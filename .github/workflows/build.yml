name: APK Derle

# Bu dosya, kodu her GitHub'a yüklediğinde (push) ya da "Actions" sekmesinden
# elle tetiklediğinde, GitHub'ın kendi bulut sunucusunda projeyi derleyip
# indirilebilir bir APK üretmesini sağlar. Kendi bilgisayarının gücü hiç
# kullanılmaz.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # "Actions" sekmesinden elle "Run workflow" ile de tetiklenebilir

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Debug APK derle
        run: gradle assembleDebug --stacktrace

      - name: APK'yı indirilebilir çıktı olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: hesap-yoneticisi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
