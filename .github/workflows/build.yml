name: Android CI & Release
on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Compatible Gradle Wrapper
      run: gradle wrapper --gradle-version 8.6

    - name: Build Both APKs
      run: ./gradlew assembleDebug assembleRelease -x lint -x test

    # Sorunlu eklenti yerine Native (Yerel) İmzalama Adımı
    - name: Sign Release APK (Native)
      if: startsWith(github.ref, 'refs/tags/')
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        # 1. Base64 şifreyi çözüp imza dosyasını oluştur
        echo $KEYSTORE_BASE64 | base64 --decode > release-key.jks
        
        # 2. Sunucudaki en güncel Android Build Tools sürümünü bul
        export BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
        
        # 3. APK'yı optimize et (Zipalign)
        $BUILD_TOOLS/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
        
        # 4. APK'yı imzala (Apksigner)
        $BUILD_TOOLS/apksigner sign --ks release-key.jks --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --ks-key-alias $KEY_ALIAS --out Accounts-Center-Stable.apk app-release-aligned.apk

    - name: Upload Debug Artifact (For Normal Push)
      if: "!startsWith(github.ref, 'refs/tags/')"
      uses: actions/upload-artifact@v4
      with:
        name: Accounts-Center-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          Accounts-Center-Stable.apk
          app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
